title: User Consent to Unverified Application Requesting Mail or File Scopes
id: 3c9a7d52-5b1e-4f6a-9d0e-2a71c4e8b101
status: experimental
description: |
    Detects an end user consenting to an application from an unverified publisher that requests
    mail or file read scopes. Derived from Hypothesis A in the CTI Hunt Loop Kit lab. Pair with a
    change-calendar check in your SIEM: consents outside approved change windows and without a
    ticket are the highest priority. Field names follow common Entra ID audit log mappings; confirm
    them against your own pipeline before deployment.
references:
    - https://attack.mitre.org/techniques/T1528/
    - https://learn.microsoft.com/en-us/entra/architecture/security-operations-applications
author: Dan Sorensen (CTI Hunt Loop Kit)
date: 2026-11-01
tags:
    - attack.credential-access
    - attack.t1528
logsource:
    product: azure
    service: auditlogs
detection:
    selection_operation:
        ActivityDisplayName: 'Consent to application'
        ConsentContext.IsAdminConsent: 'false'
    selection_scope:
        TargetResources.ModifiedProperties.NewValue|contains:
            - 'Mail.Read'
            - 'Mail.ReadWrite'
            - 'Files.Read.All'
            - 'Files.ReadWrite.All'
    filter_verified:
        TargetResources.PublisherVerified: 'true'
    condition: all of selection_* and not filter_verified
falsepositives:
    - Legitimate productivity apps from unverified publishers approved through an exception process
level: medium
