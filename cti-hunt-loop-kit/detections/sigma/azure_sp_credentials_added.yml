title: Credentials Added to Existing Service Principal
id: 8e41b0f3-6c2d-4a9b-b7e5-1d93f0a6c202
status: experimental
description: |
    Detects credentials (secrets or certificates) added to an existing service principal. Derived
    from Hypothesis A in the CTI Hunt Loop Kit lab. Expect legitimate rotations; prioritize events
    outside approved change windows, without a change ticket, or from the same IP as a suspicious
    consent. Confirm field names against your own pipeline before deployment.
references:
    - https://attack.mitre.org/techniques/T1098/001/
author: Dan Sorensen (CTI Hunt Loop Kit)
date: 2026-11-01
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098.001
logsource:
    product: azure
    service: auditlogs
detection:
    selection:
        ActivityDisplayName: 'Add service principal credentials'
    condition: selection
falsepositives:
    - Scheduled certificate or secret rotation
level: medium
