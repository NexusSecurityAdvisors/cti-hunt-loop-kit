title: HL-0002 LSASS Memory Dump via Command Line
id: c1eaa128-fa86-4616-af24-c19b1b38793f
status: experimental
description: |
    Hunt query for the CTI Hunt Loop Kit (playbook HL-0002). Detects command lines that dump
    LSASS process memory with built-in or dual-use tools: comsvcs.dll MiniDump via rundll32,
    Sysinternals ProcDump, and Task Manager-style dump utilities targeting lsass.
references:
    - https://attack.mitre.org/techniques/T1003/001/
    - https://github.com/NexusSecurityAdvisors/cti-hunt-loop-kit/blob/main/playbooks/HL-0002-T1003.001-lsass-credential-dumping.md
author: Dan Sorensen
date: 2026-10-30
tags:
    - attack.credential-access
    - attack.t1003.001
    - attack.stealth
    - attack.t1218.011
logsource:
    category: process_creation
    product: windows
detection:
    selection_comsvcs:
        CommandLine|contains: 'comsvcs'
        CommandLine|contains|all:
            - 'MiniDump'
    selection_comsvcs_ordinal:
        CommandLine|contains|all:
            - 'comsvcs'
            - '#24'
    selection_procdump:
        CommandLine|contains:
            - ' -ma '
            - ' /ma '
            - ' -mm '
            - ' -mp '
        CommandLine|contains|all:
            - 'lsass'
    selection_generic:
        CommandLine|contains|all:
            - 'lsass'
            - '.dmp'
    condition: 1 of selection_*
falsepositives:
    - Authorized incident response or troubleshooting dumps of LSASS (should be rare and change-controlled)
    - Security tooling that collects LSASS dumps for crash analysis
level: high
