# Link checker configuration (used by the scheduled maintenance workflow).
max_retries = 3
retry_wait_time = 5
timeout = 30
max_concurrency = 8
accept = [200, 203, 206, 429]
exclude_path = ["data/lab"]
exclude = [
  # Hosts that block automated checkers but are verified manually
  "^https://www\\.sans\\.org/",
  "^https://researchr\\.org/",
  "^https://dataexplorer\\.azure\\.com/",
  # Return 403 to automated checkers; verified manually (ICD 203 redirects to archive.dni.gov and loads; PEAK post loads)
  "^https://www\\.dni\\.gov/files/documents/ICD/ICD-203\\.pdf$",
  "^https://www\\.splunk\\.com/en_us/blog/security/peak-threat-hunting-framework\\.html$",
  # Placeholders and examples
  "example\\.(com|org)",
  "\\.example(/|$)",
  "^https://<",
]
