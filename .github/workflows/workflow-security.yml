name: Workflow security

# Audits every GitHub Actions workflow with zizmor (template injection, excessive permissions,
# unpinned actions, credential persistence, dangerous triggers) and reports to code scanning.
on:
  push:
    branches: [main]
    paths: [".github/**"]
  pull_request:
    paths: [".github/**"]
  schedule:
    - cron: "23 8 * * 3" # weekly, Wednesday 08:23 UTC, to pick up new audit rules

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Run zizmor
        run: |
          pip install "zizmor==1.31.1"
          zizmor --format sarif .github/workflows > zizmor.sarif || true
          zizmor --min-severity medium .github/workflows

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: zizmor.sarif
          category: zizmor
