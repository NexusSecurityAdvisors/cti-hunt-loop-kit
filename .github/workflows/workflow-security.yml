name: Workflow security

# Audits every GitHub Actions workflow with zizmor (template injection, excessive permissions,
# unpinned actions, credential persistence, dangerous triggers) and reports to code scanning.
on:
  push:
    branches: [main]
    paths: [".github/**"]
  pull_request:
    paths: [".github/**"]
  schedule:
    - cron: "23 8 * * 3" # weekly, Wednesday 08:23 UTC, to pick up new audit rules

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version

      - name: Run zizmor
        run: |
          pip install "zizmor==1.31.1"
          zizmor --format sarif .github/workflows > zizmor.sarif || true
          zizmor --min-severity medium .github/workflows

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: zizmor.sarif
          category: zizmor
