name: Scheduled maintenance

# Keeps the kit current without anyone having to remember:
#   weekly    - broken links, sources older than 4 years, new ATT&CK release  -> one tracking issue
#   quarterly - content-review reminder issue with a checklist
# Each check updates its own issue (no duplicates) and closes it automatically once clean.
on:
  schedule:
    - cron: "37 9 * * 1"   # weekly checks, Monday 09:37 UTC
    - cron: "11 13 1 1,4,7,10 *" # quarterly reminder, 1st of Jan/Apr/Jul/Oct
  workflow_dispatch:
    inputs:
      task:
        description: Which task to run
        type: choice
        options: [weekly, quarterly]
        default: weekly

permissions: {}

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  weekly:
    if: github.event.schedule == '37 9 * * 1' || inputs.task == 'weekly'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Check links
        id: links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config .lychee.toml --no-progress "./**/*.md" "./queries/**/*.yml"
          output: lychee-report.md
          fail: false
          jobSummary: true

      - name: Build maintenance report
        env:
          GH_TOKEN: ${{ github.token }}
          LINKS_EXIT: ${{ steps.links.outputs.exit_code }}
        run: |
          {
            echo "_Automated weekly check, $(date -u +%Y-%m-%d). This issue closes itself when everything is clean._"
            echo
            echo "## Sources older than 4 years"
            python tools/build_references.py --stale --as-issue | tee stale.txt
            echo
            echo "## MITRE ATT&CK release"
            latest=$(git ls-remote --tags --refs https://github.com/mitre-attack/attack-stix-data.git \
              | awk -F/ '{print $3}' | grep -E '^v[0-9]+\.[0-9]+$' | sort -V | tail -1)
            ours=$(sed -n 's/^ATTACK_VERSION = "\(.*\)"/\1/p' tools/build_navigator_layer.py)
            echo "Latest: \`$latest\` · kit layer targets: \`v$ours\`"
            case "$latest" in
              "v$ours".*) echo "Up to date." ;;
              *) echo "- [ ] Review the release notes, re-check tactic names in the Sigma tags, bump \`ATTACK_VERSION\` and run \`python tools/build_navigator_layer.py\`." ; echo NEEDS_ACTION >> flags ;;
            esac
            echo
            echo "## Links"
            if [ "${LINKS_EXIT:-0}" != "0" ]; then cat lychee-report.md; echo NEEDS_ACTION >> flags; else echo "No broken links."; fi
          } > report.md
          grep -q '^- \[ \]' stale.txt && echo NEEDS_ACTION >> flags || true
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Maintenance: links, source freshness, ATT&CK version"
          gh label create maintenance --color 0E8A16 --description "Automated upkeep" 2>/dev/null || true
          num=$(gh issue list --label maintenance --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -f flags ]; then
            if [ -n "$num" ]; then gh issue edit "$num" --body-file report.md; else gh issue create --title "$title" --label maintenance --body-file report.md; fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "All checks clean on $(date -u +%Y-%m-%d)."
          fi

  quarterly:
    if: github.event.schedule == '11 13 1 1,4,7,10 *' || inputs.task == 'quarterly'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open the quarterly content review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          q="$(date -u +%Y)-Q$(( ($(date -u +%-m) - 1) / 3 + 1 ))"
          gh label create content-review --color 1D76DB --description "Scheduled content review" 2>/dev/null || true
          if gh issue list --label content-review --state all --search "in:title $q" --json number --jq '.[0].number' | grep -q .; then exit 0; fi
          gh issue create --label content-review --title "Quarterly content review $q" --body "$(cat <<'EOF'
          Scheduled reminder. Work through the list and close this issue when done.

          - [ ] Read the latest CISA #StopRansomware and joint advisories; does any playbook's *Intelligence basis* need an update or a new playbook?
          - [ ] Check new Sigma rules upstream (SigmaHQ) for techniques the kit hunts; port improvements and add lab events for them.
          - [ ] Review open *False positive* issues and fold them into each playbook's *Known benign sources*.
          - [ ] Replace or re-confirm any source flagged in `docs/REFERENCES.md` as older than 4 years.
          - [ ] Re-record the demo GIF (`python tools/render_demo_gif.py`) if rules or data changed.
          - [ ] Cut a release (`git tag vX.Y.Z && git push --tags`) if content changed this quarter.
          EOF
          )"
