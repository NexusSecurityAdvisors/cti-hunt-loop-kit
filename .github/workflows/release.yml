name: Release

# Tag vX.Y.Z to publish a release: validated kit archive + CycloneDX SBOM, each with a signed
# SLSA build-provenance attestation (verify with `gh attestation verify <file> -R <owner>/<repo>`).
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # sign attestations (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version

      - name: Validate before packaging
        run: |
          pip install -r requirements.txt
          sigma check queries/sigma
          python tests/test_lab_detections.py
          python tests/test_repo_consistency.py
          python tools/build_navigator_layer.py --check
          python tools/build_references.py --check

      - name: Package kit and SBOM
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          git archive --format=zip --prefix="cti-hunt-loop-kit-${TAG}/" -o "dist/cti-hunt-loop-kit-${TAG}.zip" HEAD
          pip install "cyclonedx-bom==7.6.0"
          cyclonedx-py requirements requirements.txt --of JSON -o "dist/cti-hunt-loop-kit-${TAG}.cdx.json"
          (cd dist && sha256sum ./* > SHA256SUMS)

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=$(awk -v t="## ${TAG}" 'index($0,t)==1{f=1;next} /^## v/{f=0} f' CHANGELOG.md)
          gh release create "$TAG" dist/* --title "CTI Hunt Loop Kit ${TAG}" --notes "${notes:-See CHANGELOG.md}" --verify-tag
