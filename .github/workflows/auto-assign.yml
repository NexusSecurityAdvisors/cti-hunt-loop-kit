# Auto-assign every new issue and pull request to Dan Sorensen (DanPazlev).
# Remove this file to stop auto-assignment.
name: Auto-assign

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened]

permissions: {}

jobs:
  assign:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Assign DanPazlev
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: gh api -X POST "repos/${REPO}/issues/${NUMBER}/assignees" -f "assignees[]=DanPazlev"
