# Auto-assign every new issue and pull request to Dan Sorensen (DanPazlev).
# Remove this file to stop auto-assignment.
name: Auto-assign

on:
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened]

permissions:
  issues: write
  pull-requests: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const number = context.payload.issue?.number ?? context.payload.pull_request?.number;
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              assignees: ['DanPazlev'],
            });
