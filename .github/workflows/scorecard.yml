name: OpenSSF Scorecard

# Supply-chain security posture (branch protection, pinned dependencies, token permissions, ...).
# Results go to code scanning and to the public Scorecard API that powers the README badge.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 7 * * 2" # weekly, Tuesday 07:41 UTC
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

jobs:
  scorecard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
      id-token: write # publish results to the Scorecard API (badge)
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: scorecard.sarif
          retention-days: 7

      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: scorecard.sarif
