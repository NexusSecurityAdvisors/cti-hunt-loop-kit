# Bibliography for the CTI Hunt Loop Kit: the single source of truth.
# tools/build_references.py renders docs/REFERENCES.md from this file and checks freshness.
#
# Fields:
#   id         stable key, cited as [id] in docs
#   type       academic | government | industry | standard
#   published  YYYY-MM of the version cited (latest revision for living advisories)
#   evergreen  true for continuously maintained resources (exempt from the age check)
#   used_by    playbook IDs (HL-####) or "general"
#
# Freshness policy: non-evergreen sources older than MAX_AGE_YEARS (4) are flagged by CI
# and by the weekly maintenance workflow, which opens a review issue.

